name: Sync repository scores
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/sync-results.mjs
      - site/backend-config.js
      - .github/workflows/sync-results.yml
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Sync public scores
        id: sync
        run: |
          node scripts/sync-results.mjs
          git add site/results.json RESULTS.md
          if git diff --cached --quiet; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'Sync backend-scored student results'
            git push origin HEAD:main
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          fi
      - if: steps.sync.outputs.changed == 'true'
        run: npm run build
      - if: steps.sync.outputs.changed == 'true'
        uses: actions/configure-pages@v5
      - if: steps.sync.outputs.changed == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - if: steps.sync.outputs.changed == 'true'
        id: deployment
        uses: actions/deploy-pages@v4
